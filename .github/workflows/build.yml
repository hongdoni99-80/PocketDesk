name: WindowDesk APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            Z=$(find . -name '*.zip' -not -path './.git/*' | head -1)
            echo "zip: $Z"
            test -n "$Z" || { echo "저장소에 zip도 프로젝트 파일도 없습니다"; exit 1; }
            mkdir -p /tmp/proj
            unzip -q "$Z" -d /tmp/proj
            F=$(find /tmp/proj -name settings.gradle.kts | head -1)
          fi
          echo "found: $F"
          test -n "$F" || { echo "zip 안에 settings.gradle.kts가 없습니다"; exit 1; }
          cd "$(dirname "$F")"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: WindowDesk-APK
          path: out/app-debug.apk
